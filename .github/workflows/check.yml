# The bench tools still build and start, and the recorded results still make the results page.
# Nothing here touches a probe.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The tools resolve their dependencies and start
        run: |
          uv run tools/throughput.py --help > /dev/null
          uv run tools/wireclock.py --help > /dev/null

      - name: The tools against a fake probe, analyser and probe-rs
        run: uv run tools/tools_test.py

      # Every set page/sets.json names.
      - name: The committed page is the one the results make
        run: uv run --no-project python -I page/build.py --check

  swd-throughput:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mculink-bench/tools/swd-throughput
    steps:
      # swd-throughput builds against verge-probe beside this repository, and verge-probe against
      # tickwave beside it.
      - uses: actions/checkout@v7
        with:
          path: mculink-bench
      - uses: actions/checkout@v7
        with:
          repository: Escapement-Project/verge-probe
          path: verge-probe
      - uses: actions/checkout@v7
        with:
          repository: Escapement-Project/tickwave
          path: tickwave

      - name: probe-rs's USB stack needs libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        run: |
          # GitHub's runners have rustup; act's images do not.
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy, warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
