[package]
name = "swd-throughput"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
# probe-rs's default features without its hidapi backend: verge-probe's hidapi selects one, and
# two fail the build.
probe-rs = { git = "https://github.com/CordlessCoder/probe-rs", rev = "17beb8e80", default-features = false, features = ["builtin-targets", "builtin-formats", "cmsisdap_v1", "coredump"] }
tracing = "0.1.44"
# Verge's cJTAG vendor commands. A path until the repositories are published, as in verge.
escapement-verge-probe = { path = "../../../verge-probe" }
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace]

[profile.release]
debug = true
