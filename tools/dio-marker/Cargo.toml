[package]
name = "dio-marker"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { git = "https://github.com/CordlessCoder/embassy", rev = "71f54dfee9b170613936fcde2ee26f16f83295c0", version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-mspm0 = { git = "https://github.com/CordlessCoder/embassy", rev = "71f54dfee9b170613936fcde2ee26f16f83295c0", version = "0.1.0", features = ["mspm0l1306rhb", "defmt", "rt", "time-driver-any"] }
embassy-time = { git = "https://github.com/CordlessCoder/embassy", rev = "71f54dfee9b170613936fcde2ee26f16f83295c0", version = "0.5.1", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[workspace]

[profile.release]
debug = 2
