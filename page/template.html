<!-- The face chosen on an earlier visit, before the first paint; and .js, which tells base.css the

<!-- The design tokens and the shared base sheet are copies of the site's (tokens.css, base.css),
     inlined by build.py; then the page's own sheet. -->
<style>__TOKENS__</style>
<style>__BASE__</style>
<style>
/* The page's own parts, after tokens.css and base.css (copies of the site's, inlined above): the
   page's row in the header, its head, its controls, the chart code's marks, and tickwave's
   elements. The header, sections, figures, ruled rows and type come from base.css unchanged. */
[hidden] { display: none !important; }
code { font: var(--code-weight) 14px/1.5 var(--font-code); font-stretch: var(--code-stretch); overflow-wrap: anywhere; }
.quiet { color: var(--ink-2); font-size: 15px; }
/* The page's own controls take the focus ring base.css gives links and buttons. */
summary:focus-visible, select:focus-visible, input:focus-visible { outline: var(--focus-width) solid var(--ink); outline-offset: 3px; }

/* The page's head: the title, the headline, the conditions. */
.page-head { padding-top: 24px; padding-bottom: 48px; }
.page-head h1 { margin-bottom: 28px; }

/* The headline: our fastest write in a window of lume, at the scale of the landing dial's window;
   the comparison beside it as sentences. */
.headline { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "window claim" ". versus" ". same"; gap: 0 24px; align-items: center; margin-bottom: 36px; }
.window { grid-area: window; justify-self: start; background: var(--lume); color: var(--on-lume); box-shadow: inset 0 0 0 1px var(--window-edge); border-radius: 5px; padding: 7px 14px 8px; font: var(--figures-weight) 26px/1.25 var(--font-figures); font-stretch: var(--figures-stretch); font-variant-numeric: tabular-nums; white-space: nowrap; }
.window small { font-size: .6em; margin-left: .3em; }
.window:empty { display: none; }
.noscript { max-width: 40em; margin: 0 0 28px; color: var(--ink-2); }
.headline .claim { grid-area: claim; font: 500 20px/1.5 var(--font-text); max-width: 42em; margin: 0; text-wrap: balance; }
.headline .versus { grid-area: versus; margin: 8px 0 0; max-width: 44em; text-wrap: pretty; }
.headline .same { grid-area: same; margin: 6px 0 0; max-width: 48em; text-wrap: pretty; }

/* The conditions: a ruled row that opens. */
.conditions { border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.conditions summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; list-style: none; font-size: 15px; }
.conditions summary::-webkit-details-marker { display: none; }
.conditions summary::before { content: ""; width: 7px; height: 7px; margin: 0 2px 3px 3px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(-45deg); }
.conditions[open] summary::before { transform: rotate(45deg); margin-bottom: 5px; }
.conditions summary:hover { background: var(--wash); }
.conditions-body { padding: 4px 0 20px; }
.conditions-body > p { color: var(--ink-2); font-size: 15px; }
.conditions .specs { font-size: 15px; }
.conditions .builds > div { grid-template-columns: minmax(7em, 40%) minmax(0, 1fr); }

/* Segmented controls, hue-free: outlined in rule, the pressed one an ink fill with page text. */
.views, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.seg-label { color: var(--ink-2); font-size: 15px; }
.seg-row { display: inline-flex; flex-wrap: wrap; }
.seg-row button { font: 500 14px/1 var(--font-text); color: var(--ink); background: transparent; border: 1px solid var(--rule); margin: 0 0 0 -1px; padding: 9px 12px; min-height: 36px; cursor: pointer; }
.seg-row button:first-child { margin-left: 0; border-radius: 6px 0 0 6px; }
.seg-row button:last-child { border-radius: 0 6px 6px 0; }
.seg-row button:only-child { border-radius: 6px; }
.seg-row button:hover { background: var(--wash); }
.seg-row button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); position: relative; z-index: 1; }
.seg-row button:focus-visible { position: relative; z-index: 2; }
.controls { gap: 14px 16px; margin-bottom: 14px; }
.controls .seg-row button { font-size: 13px; padding: 9px 9px; }
.seg { display: grid; gap: 6px; }
.seg .seg-label { font-size: 14px; }

/* The key: which probes every figure shows. A swatch is drawn with its chart line's own classes. */
.chart-key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 28px; font-size: 15px; }
.chart-key label { display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; }
.chart-key input { margin: 0 8px 0 0; width: 16px; height: 16px; accent-color: var(--ink); }
.chart-key label.off { color: var(--ink-2); }
.chart-key label.off .swatch { opacity: .5; }
.swatch { width: 26px; height: 10px; margin-right: 6px; flex: none; overflow: visible; vertical-align: middle; }

/* A section's figures: two to a row, a wide one across both. */
.figs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px var(--gutter); align-items: start; }
.figs > .wide { grid-column: 1 / -1; }
.figs + .figs, .figs + .specs, .prose + .figs, .figs + .prose { margin-top: 44px; }
.chart { padding: 14px 12px 10px; }
/* The chart code draws its SVG with the class "chart" too: there it is the drawing, not the panel. */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; background: none; padding: 0; border-radius: 0; position: static; }
.readout { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; padding: 8px 4px 2px; border-top: 1px solid var(--hair); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
.readout > span { display: inline-flex; align-items: center; white-space: nowrap; }
.readout > span:first-child { font-weight: 600; }
.readout .micro { color: var(--ink); }
.chart > p.micro { margin: 8px 4px; color: var(--ink-2); font-size: 15px; }
.prose p { max-width: 36em; }
h3 { font: 600 17px/1.4 var(--font-text); margin: 0 0 4px; }
/* A part of a section with a heading of its own: the custom host's matrix in Throughput. */
.part { margin-top: 56px; }
.part > h3 { margin-bottom: 16px; }
.notes > div { grid-template-columns: minmax(7em, 30%) minmax(0, 1fr); }

/* Chart marks. Verge is teal (Clang solid with circles, GCC dashed with squares), NXP's firmware
   blue with circles, dotted and hollow past the fastest clock it reads right at; reference probes
   share the context grey and the reference dash, told apart by marker and name; a run under energy
   capture is thinner and fainter. */
.ax { stroke: var(--rule); stroke-width: 1; fill: none; }
.grid-line { stroke: var(--hair); stroke-width: 1; fill: none; }
.tick { fill: var(--ink-2); font: 400 12px var(--font-text); font-variant-numeric: tabular-nums; }
.axis-name { fill: var(--ink-2); font: 500 12px var(--font-text); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.line.gcc, .line.clang { stroke: var(--series-verge); }
.line.gcc { stroke-dasharray: var(--dash-second-build); }
.line.stock { stroke: var(--series-nxp); }
.line.ref0, .line.ref1, .line.ref2, .line.jlink { stroke: var(--series-context); stroke-dasharray: var(--dash-reference); }
.line.misread { stroke-dasharray: var(--dash-misread); }
.line.cond { stroke-width: var(--capture-width); opacity: var(--capture-opacity); }
/* Two runs of one build under capture: the first keeps the build's pattern, the second a long dash. */
.line.cond1 { stroke-dasharray: var(--dash-capture-second); }
.mk { stroke: var(--surface); stroke-width: 2; }
.mk.gcc, .mk.clang { fill: var(--series-verge); }
.mk.stock { fill: var(--series-nxp); }
.mk.ref0, .mk.ref1, .mk.ref2, .mk.jlink { fill: var(--series-context); }
.mk.hollow { fill: var(--surface); }
.mk.hollow.stock { stroke: var(--series-nxp); }
.mk.hollow.gcc, .mk.hollow.clang { stroke: var(--series-verge); }
.mk.hollow.ref0, .mk.hollow.ref1, .mk.hollow.ref2, .mk.hollow.jlink { stroke: var(--series-context); }
.mk.cond { opacity: var(--capture-opacity); }
/* The key sits on the page, not on a chart's surface. */
.chart-key .mk { stroke: var(--page); }
.chart-key .mk.hollow { fill: var(--page); }
.fail-mark { stroke: var(--fault-ink); stroke-width: 2; fill: none; }
.fail-text { fill: var(--fault-ink); font: 600 12px var(--font-text); }
.sel-rule { stroke: var(--ink); stroke-opacity: .35; stroke-width: 1; fill: none; }
.hit { fill: transparent; cursor: pointer; }
/* A clock's column under focus: the 2 px ink ring, drawn as the column's own outline. */
.hit:focus-visible { outline: none; stroke: var(--ink); stroke-width: var(--focus-width); }
svg .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
.ref-text { fill: var(--ink-2); font: 500 12px var(--font-text); }
.ring { fill: none; stroke: var(--ink); stroke-width: 1; }
.line.jlink-read, .line.jlink-write { stroke: var(--series-context); }
.line.jlink-write { stroke-dasharray: var(--dash-second-build); }
.mk.jlink-read, .mk.jlink-write { fill: var(--series-context); }

/* The misread drawn as SWCLK: red only on the misread transfer. */
.trace { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linejoin: miter; }
.trace.bad { stroke: var(--fault-ink); }
.trace-break { stroke: var(--fault-ink); stroke-width: 2; fill: none; }
.trace-label { fill: var(--ink-2); font: 600 12px var(--font-text); }
.trace-value { fill: var(--ink); font: 400 11.5px var(--font-text); font-variant-numeric: tabular-nums; }
.trace-value.bad { fill: var(--fault-ink); }

/* Case maps: a mark per case, a row per clock; the fault fill only on cases that failed. */
.pips { display: grid; gap: 6px; padding: 4px 4px 2px; }
.pip-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pip-row svg { width: 100%; height: auto; display: block; }
.pip { fill: var(--hair); }
.pip.bad { fill: var(--fault-fill); }
.pip.stall { fill: var(--ink-2); }
.chart > .legend { padding: 0 4px 10px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 6px; border-radius: 2px; }

/* On the wire: the set's part, with the section's own head. tickwave's elements take the page's
   colours and fonts from the tokens; their parts take the site's ruled rows. */
.band:has(> .wrap > #on-the-wire[hidden]) { display: none; }
#on-the-wire .wire-view { border: 0; padding: 0; }
.recordings { margin-top: 32px; }
.recordings tickwave-view { margin: 0; font-size: 15px; }
/* A row per recording, as the site's repository index: its title, what it holds under it, and
   the button that opens it. */
.recordings tickwave-view::part(summary) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 24px; align-items: center; padding: 14px 0; background: none; border: 0; border-top: 1px solid var(--hair); border-radius: 0; }
.recordings tickwave-view::part(facts) { grid-row: 2; grid-column: 1; }
.recordings tickwave-view::part(open-button) { grid-row: 1 / 3; grid-column: 2; }
.recordings tickwave-view:last-child::part(summary) { border-bottom: 1px solid var(--hair); }
.recordings tickwave-view::part(title) { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.recordings tickwave-view::part(facts) { color: var(--ink-2); font-size: 15px; }
.recordings tickwave-view::part(open-button) { font-size: 14px; padding: 5px 14px; min-height: 32px; }
.recordings tickwave-view::part(viewer) { background: var(--surface); border: 0; border-radius: 14px; margin: 14px 0; }
tickwave-ref { cursor: help; }

/* The page's own row in the header, under the shared row that every page shows: the wire, and
   the measurement set. The script makes it (.js). Buttons for the wire from 861 px, where they and
   the set's menu fit one row with room to spare; a menu below that. Every control is 32 px tall,
   so the row is, in every browser. */
:root.js { --header: 101px; }
.js header .wrap { grid-template-rows: 60px auto; grid-template-areas: "brand nav face" "tools tools tools"; row-gap: 0; padding-bottom: 8px; }
.dock { grid-area: tools; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.dock .wire { display: flex; align-items: center; gap: 8px 12px; }
.dock .seg-row button { font-size: 13px; padding: 0 10px; height: 32px; min-height: 0; }
.dock .seg-label, .set-picker { font-size: 14px; color: var(--ink-2); }
.dock select { height: 32px; font: 500 14px/1.2 var(--font-text); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--page); border: 1px solid var(--rule); border-radius: 6px; padding: 0 6px; }
.dock .menu { display: none; }
.set-picker { display: inline-flex; align-items: center; gap: 8px; }

@media (min-width: 2000px) {
  /* The heading column beside the content, as the site's sections have it. */
  .band:has(#on-the-wire) #on-the-wire, .band #on-the-wire .wire-view { display: contents; }
  #on-the-wire .wire-view > :not(.head) { grid-column: 2; }
}
@media (max-width: 860px) {
  :root.js { --header: 89px; }
  .js header .wrap { grid-template-rows: 34px auto; row-gap: 6px; }
  .dock .buttons { display: none; }
  .dock .menu { display: inline-flex; align-items: center; gap: 8px; }
  .figs { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  /* Under the mark, the menu and the switch; the set's label is read out but not shown, so both
     controls share the row down to 320 px. */
  .js header .wrap { grid-template-areas: "brand . menu face" "tools tools tools tools"; }
  .set-picker .set-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .headline { grid-template-columns: minmax(0, 1fr); grid-template-areas: "window" "claim" "versus" "same"; }
  .headline .claim { margin-top: 14px; font-size: 18px; }
  .pip-row { grid-template-columns: 44px minmax(0, 1fr); gap: 6px; }
}
@media (max-width: 400px) {
  /* The wire's menu and the set's share the row down to 320 px: the row never wraps, and where a
     scrollbar takes its room the wire's menu narrows instead. */
  .dock { flex-wrap: nowrap; column-gap: 12px; }
  .dock .wire, .dock .menu, .dock .menu select { min-width: 0; }
  .dock .menu { gap: 6px; }
}
</style>
</head>

        <figure><div class="chart"><div id="c-write"></div></div><figcaption><b class="n"></b> probe-rs, 4 KiB writes. KiB/s, median of 7, attach excluded.</figcaption></figure>

          </figure>

<section class="band" id="jlink-head" aria-labelledby="jlink-title">

    </div>

<!-- The day and night switch and the header's script: copies of the site's face.js and header.js. -->
<script>__FACEJS__</script>
<script>__HEADERJS__</script>
<script>
const ALL = JSON.parse(document.getElementById("data").textContent);
let SET = ALL.order[ALL.order.length - 1];
let D = ALL.sets[SET];
let VIEW = D.views[0].id;
let WANT = VIEW;  // the wire last picked, kept through a set that lacks it
let V = D.views[0];
// The user's choices of which series to show, by view and series; otherwise conditions and the
// dated J-Link reference start hidden.
const shown = {};
const fmt = (v, d = 0) => v == null ? "–" : v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const relativePercent = (ratio) => {
  const change = Math.round((ratio - 1) * 100);
  return `${change < 0 ? "−" : "+"}${fmt(Math.abs(change))}%`;

function renderTop() {

  $("jlink-head").hidden = !on;
  $("jlink-grid").hidden = !on;
  if (!on) return;
  const R = ALL.references.jlink;
  const xs = R.jlinkexe.map((p) => p.mhz);
  const entry = (name, style, values) => ({ s: { id: style, name, role: "reference", style, condition: null }, values });
  const series = [
    entry("TestRSpeed, read", "jlink-read", R.jlinkexe.map((p) => p.read_kbyte_s)),
    entry("TestWSpeed, write", "jlink-write", R.jlinkexe.map((p) => p.write_kbyte_s)),
  ];
  chart($("jlink-chart"), { xs, series, unit: "KByte/s", digits: 0, selected: xs.indexOf(10), height: 300, width: widthOf("jlink-chart", 1200) });
  $("jlink-description").textContent = "JLinkExe uses a different workload from the 4 KiB probe-rs charts.";
  $("jlink-tool-note").textContent = `${R.firmware}. ${R.target_state}.`;
}

let readChart, writeChart;
let mainSelectedClock = null;
function renderProbeRs() {
  const list = visible();
  const prClocks = prClocksOf(list);
  const prXs = prClocks.map((k) => k / 1000);
  const entries = (arm, field = "kib") => list.map((s) => {
    const size = arm === "rt" ? 4 : 4096;
    const at = prClocks.map((k) => PR(s, arm, size, k));
    return {
      s, wrong: wrongClocks(s, prClocks), values: at.map((p) => p?.[field] ?? null), failed: prClocks.map((k) => PR_FAILED(s, k)),
      partial: prClocks.map((k) => { const p = PART(s, arm, size, k); return p && !complete(p) ? p : null; }),
      ranges: at.map((p) => p && p.runs > 1 && p.kib_lo != null && field === "kib" ? [p.kib_lo, p.kib_hi] : null),
    };
  });
  const selectedClock = (comparisonClock() ?? prClocks.at(-1)) / 1000;
  const fallback = prXs.indexOf(selectedClock);
  const kept = prXs.indexOf(mainSelectedClock ?? selectedClock);
  const index = kept >= 0 ? kept : fallback;
  mainSelectedClock = prXs[index];
  readChart = chart($("c-read"), { xs: prXs, series: entries("read32"), unit: "KiB/s", selected: index, width: widthOf("c-read", 640), onSelect: (i) => { mainSelectedClock = prXs[i]; writeChart.show(i); } });
  writeChart = chart($("c-write"), { xs: prXs, series: entries("write32"), unit: "KiB/s", selected: index, width: widthOf("c-write", 640), onSelect: (i) => { mainSelectedClock = prXs[i]; readChart.show(i); } });

  const rtList = list.filter((s) => !s.external);
  const rtEntries = rtList.map((s) => ({
    s, wrong: wrongClocks(s, prClocks), values: prClocks.map((k) => PR(s, "rt", 4, k)?.us ?? null), failed: prClocks.map((k) => PR_FAILED(s, k)),
    partial: prClocks.map((k) => { const p = PART(s, "rt", 4, k); return p && !complete(p) ? p : null; }),
  }));
  chart($("c-rt"), { xs: prXs, series: rtEntries, unit: "µs", selected: fallback, height: 230, width: widthOf("c-rt", customSeries().length ? 640 : 1200) });
  const rts = rtList.map((s) => PR(s, "rt", 4, selectedClock * 1000)?.us).filter((v) => v != null);
  $("rt-text").textContent = rts.length ? `${selectedClock} MHz: ${fmt(Math.min(...rts))}–${fmt(Math.max(...rts))} µs across the series shown.` : "";
}

/* Explorer over the custom host's matrix: SWD only */
const WORDS = { block: { read: [1, 8, 32, 127], write: [1, 8, 32, 126] }, transfer: { read: [1, 8, 32, 127], write: [1, 8, 32, 101] } };
const state = { command: "block", access: "ap-read", words: 3, depth: 8, metric: "kib" };
const GROUPS = [
  ["command", "Command", [["block", "DAP_TransferBlock"], ["transfer", "DAP_Transfer"]]],
  ["access", "Access", [["ap-read", "AP read"], ["ap-write", "AP write"], ["dp-read", "DP read"], ["dp-write", "DP write"]]],
  ["words", "Words", [[0, "1"], [1, "8"], [2, "32"], [3, "Full packet"]]],
  ["depth", "Depth", [[1, "1"], [2, "2"], [8, "8 queued"]]],
  ["metric", "Unit", [["kib", "KiB/s"], ["cps", "Commands/s"]]],
];
let selX = null;
const customSeries = () => visible().filter((s) => Object.keys(s.custom || {}).length);
function words() { return WORDS[state.command][state.access.endsWith("write") ? "write" : "read"][state.words]; }
function drawExplorer() {
  const list = customSeries();
  // The custom host's part shows with a matrix to draw or a failure map; before any chart in it is
  // drawn, so each takes its container's width.
  $("custom-host").hidden = !list.length && !V.series.some((s) => s.role !== "ours" && (s.fails || []).length);
  $("m-explore").hidden = !list.length;
  if (!list.length) return;
  const xs = V.meta.clocks;
  if (selX == null || selX >= xs.length) selX = xs.length - 1;
  const w = words(), idx = state.metric === "kib" ? 1 : 0;
  const series = list.map((s) => ({
    s, wrong: wrongClocks(s, xs.map(kHz)),
    values: xs.map((m) => C(s, state.command, state.access, w, state.depth, m)?.[idx] ?? null),
    failed: xs.map((m) => C(s, state.command, state.access, w, state.depth, m) === null),
  }));
  $("x-caption").textContent = `${state.command === "block" ? "DAP_TransferBlock" : "DAP_Transfer"}, ${state.access.replace("-", " ")}, ${w} words, depth ${state.depth}`;
  chart($("c-explore"), { xs, series, unit: state.metric === "kib" ? "KiB/s" : "commands/s", digits: state.metric === "kib" && Math.max(...series.flatMap((e) => e.values.filter((v) => v != null))) < 100 ? 1 : 0, selected: selX, onSelect: (i) => { selX = i; }, height: 330, width: widthOf("c-explore", 1200) });
  let peak = null;
  for (const s of list.filter((x) => x.role === "ours")) for (const [key, value] of Object.entries(s.custom || {})) {
    if (value && key.includes("|ap-") && (!peak || value[1] > peak.value)) peak = { s, key, value: value[1] };
  }
  if (peak) {
    const [command, access, words, depth, mhz] = peak.key.split("|");
    $("x-peak").textContent = `Peak: ${fmt(peak.value)} KiB/s, ${short(peak.s)}, ${words}-word ${command} ${access.replace("-", " ")}, ${mhz} MHz, depth ${depth}.`;
  } else $("x-peak").textContent = "No custom-host memory-throughput result is available.";
}
$("controls").innerHTML = GROUPS.map(([key, label, opts]) => `
  <div class="seg"><span class="seg-label">${label}</span><div class="seg-row">${opts.map(([v, t]) =>
    `<button type="button" id="seg-${key}-${v}" data-key="${key}" data-value="${v}" aria-pressed="${String(state[key]) === String(v)}">${t}</button>`).join("")}</div></div>`).join("");
$("controls").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const key = b.dataset.key;
  state[key] = typeof state[key] === "number" ? Number(b.dataset.value) : b.dataset.value;
  for (const o of $("controls").querySelectorAll(`button[data-key="${key}"]`)) o.setAttribute("aria-pressed", String(o === b));
  drawExplorer();
});

function renderCliffAndFault() {
  const list = customSeries();
  $("m-cliff").hidden = !list.length;
  const xs = V.meta.clocks;
  if (list.length) {
    const cliff = list.map((s) => ({ s, wrong: wrongClocks(s, xs.map(kHz)), values: xs.map((m) => C(s, "transfer", "ap-read", 1, 8, m)?.[0] ?? null), failed: xs.map((m) => C(s, "transfer", "ap-read", 1, 8, m) === null) }));
    chart($("c-cliff"), { xs, series: cliff, unit: "commands/s", selected: xs.length - 1, height: 230, width: widthOf("c-cliff", 640) });
    $("cliff-text").textContent = `10 MHz: ${list.filter((s) => s.role === "ours").map((s) => `${short(s)} ${fmt(C(s, "transfer", "ap-read", 1, 8, 10)?.[0])}`).join(", ")} commands/s.`;
  }
  // The first series other than ours whose custom host failed cases: stock, as a rule.
  const bad = V.series.find((s) => s.role !== "ours" && (s.fails || []).length);
  $("stock-errors").hidden = !bad;
  if (!bad) return;
  const fails = bad.fails.length, keys = Object.keys(bad.custom);
  $("fault-count").textContent = `${fails} of ${keys.length}`;
  $("pips").innerHTML = xs.map((m) => {
    const row = keys.filter((k) => k.endsWith(`|${m}`));
    const s = 10, g = 2, w = row.length * (s + g);
    const rects = row.map((k, i) => {
      const reason = bad.errors?.[k];
      return `<rect x="${i * (s + g)}" y="0" width="${s}" height="${s}" class="pip${bad.custom[k] === null ? " bad" : ""}"><title>${k.replaceAll("|", ", ")}${reason ? `: ${reason}` : ""}</title></rect>`;
    }).join("");
    return `<div class="pip-row"><span>${m} MHz</span><svg viewBox="0 0 ${w} ${s}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${m} MHz: ${row.filter((k) => bad.custom[k] === null).length} of ${row.length} cases failed">${rects}</svg></div>`;
  }).join("");
  const attach = Object.values(bad.errors || {}).some((e) => e.toLowerCase().includes("could not attach"));
  $("fault-heading").textContent = `${short(bad)} ${attach ? "attach failures" : "measurement failures"}`;
  $("fault-title").textContent = (attach ? "timed commands did not run" : "cases without a timed result") + (bad.runs > 1 ? ` in at least one of ${bad.runs} runs` : "");
}

const WIRE_FW = ["gcc", "clang", "stock"];
const WIRE_SERIES = {
  gcc: { name: "GCC", style: "gcc", role: "ours", condition: null },
  clang: { name: "Clang", style: "clang", role: "ours", condition: null },
  stock: { name: "Stock", style: "stock", role: "stock", condition: null },
};
/* The clock on the wire */
function renderWire() {
  const W = V.protocol === "swd" ? D.wire : {}, stock = W.stock;
  const shown = Object.values(W);
  for (const id of ["w-read", "w-write", "w-fast", "trace", "stall-pips"]) $(id).textContent = "";
  if (!shown.length) {
    $("wire-meta").textContent = "not measured in this set";
    $("wire-results").hidden = true;
    return;
  }
  $("wire-results").hidden = false;
  const xs = [...new Set(shown.flatMap((w) => w.rows.map((r) => r.mhz)))].sort((a, b) => a - b);
  const at = (fw, mhz) => W[fw]?.rows.find((r) => r.mhz === mhz);
  $("wire-meta").textContent = [["Matrix", shown[0].matrix], ["analyser", "100 MS/s at the target"], ["taken", shown[0].taken.slice(0, 10)]]
    .map(([k, v]) => `${k} ${v}`).join(", ");
  const series = (key) => WIRE_FW.filter((fw) => W[fw]).map((fw) => ({
    s: WIRE_SERIES[fw], values: xs.map((m) => at(fw, m)?.[key] ?? null), rings: xs.map((m) => at(fw, m)?.[`${key}_from`] === "swdio"),
  }));
  const sel = xs.indexOf(50) >= 0 ? xs.indexOf(50) : xs.length - 1;
  let rc, wc, fc;
  rc = chart($("w-read"), { xs, series: series("read"), unit: "MHz", digits: 2, selected: sel, logY: true, ref: true, width: widthOf("w-read", 640), onSelect: (i) => { wc.show(i); fc.show(i); } });
  wc = chart($("w-write"), { xs, series: series("write"), unit: "MHz", digits: 2, selected: sel, logY: true, ref: true, width: widthOf("w-write", 640), onSelect: (i) => { rc.show(i); fc.show(i); } });
  fc = chart($("w-fast"), { xs, series: series("fastest"), unit: "MHz", digits: 2, selected: sel, logY: true, ref: true, height: 250, width: widthOf("w-fast", 640), onSelect: (i) => { rc.show(i); wc.show(i); } });

  const overList = (fw) => (W[fw]?.rows || []).filter((r) => r.fastest > r.mhz * 1.005).map((r) => `${r.mhz} MHz requested (${fmt(r.fastest, 1)} MHz measured)`);
  const g50 = at("gcc", 50) || at("clang", 50);
  const so = overList("stock"), go = overList("gcc");
  $("w-fast-text").textContent = [
    so.length ? `Stock exceeds the requested clock during parts of a transfer: ${so.join(", ")}.` : "",
    go.length ? `Verge exceeds the requested clock during parts of a transfer: ${go.join(", ")}.` : "No measured Verge peak is more than 0.5% above the requested clock.",
  ].filter(Boolean).join(" ");
  const delay = stock?.rows.find((r) => r.delay != null)?.delay;
  $("w-how-caption").textContent = `${xs.length} clocks: ${WIRE_FW.filter((fw) => W[fw]).join(", ")}`;
  $("w-how").innerHTML = [
    `At a requested 50 MHz, Verge reads at ${fmt(g50?.read, 1)} MHz and writes at ${fmt(g50?.write, 1)} MHz.`,
    "Read timing matches the emulator within a few ns, apart from one edge. GCC and Clang traces match.",
    "Above 25 MHz, the analyser cannot resolve every pulse. Circled Verge points are timed from SWDIO edges using a 0x55555555 pattern.",
    delay != null ? `The target reply reaches its pins ${delay} ns after the request edge.` : "",
  ].filter(Boolean).map((t) => `<p>${t}</p>`).join("");

  // The misread, as SWCLK: the usual transfer and one misread one, drawn to scale.
  const t = stock?.trace;
  const rows = stock ? stock.rows : [];
  const mis = rows.reduce((n, r) => n + (r.failed || 0), 0);
  const misOk = rows.reduce((n, r) => n + (r.misreads_ok || 0), 0);
  $("mis-count").innerHTML = `${mis}`;
  $("wire-errors").hidden = !t || mis === 0;
  if (t) {
    $("trace-caption").textContent = `SWCLK around the acknowledgement, ${t.mhz} MHz requested, positions ${t.positions[0]} to ${t.positions[t.positions.length - 1]}, ns`;
    const WW = 1200, HH = 190, L = 92, R = 16, CAP = 160, PH = 28;
    const svg = el("svg", { viewBox: `0 0 ${WW} ${HH}`, class: "chart", role: "img", "aria-label": "SWCLK as usual and in a misread transfer" });
    $("trace").appendChild(svg);
    const total = (rows) => rows.reduce((n, [h, l]) => n + Math.min(h, CAP) + Math.min(l, CAP), 0);
    const scale = (WW - L - R) / Math.max(total(t.usual), total(t.misread));
    const draw = (phases, y0, label, bad) => {
      el("text", { x: 0, y: y0 + 4, class: "trace-label" }, svg).textContent = label;
      let x = L, d = `M${x} ${y0 + PH}`;
      phases.forEach(([h, l], i) => {
        const pos = t.positions[i];
        d += `V${y0}`;
        el("text", { x: x + 3, y: y0 - 6, class: "trace-value" }, svg).textContent = pos;
        x += Math.min(h, CAP) * scale;
        d += `H${x}V${y0 + PH}`;
        const lw = Math.min(l, CAP) * scale;
        if (l > CAP) {
          const mid = x + lw / 2;
          d += `H${mid - 7}M${mid + 7} ${y0 + PH}`;
          el("path", { d: `M${mid - 9} ${y0 + PH + 7}L${mid - 3} ${y0 + PH - 7}M${mid + 3} ${y0 + PH + 7}L${mid + 9} ${y0 + PH - 7}`, class: "trace-break" }, svg);
          el("text", { x: mid, y: y0 + PH + 20, "text-anchor": "middle", class: "trace-value bad" }, svg).textContent = `held ${fmt((h + l) / 1000, 2)} µs`;
        }
        x += lw;
        d += `H${x}`;
        const usualPeriod = t.usual[i][0] + t.usual[i][1];
        const short = bad && h + l < usualPeriod - 5;
        if (l <= CAP) el("text", { x: x - 3, y: y0 + PH + 14, "text-anchor": "end", class: `trace-value${short ? " bad" : ""}` }, svg).textContent = fmt(h + l);
      });
      el("path", { d, class: `trace${bad ? " bad" : ""}` }, svg);
    };
    draw(t.usual, 26, "Correct", false);
    draw(t.misread, 118, "Misread", true);
  }
  // One pip per stall at position 8 in the pipelined kind, red where the probe then misread.
  $("stall-pips").innerHTML = rows.map((r) => {
    const n = (r.stalls8 || 0) + (r.misreads8 || 0), s = 10, g = 2;
    const cells = Array.from({ length: Math.max(n, 1) }, (_, i) => i < r.misreads8 ? "pip bad" : i < n ? "pip stall" : "pip");
    const w = Math.max(100, cells.length) * (s + g);
    const rects = cells.map((c, i) => `<rect x="${i * (s + g)}" y="0" width="${s}" height="${s}" class="${c}"></rect>`).join("");
    return `<div class="pip-row"><span>${r.mhz} MHz</span><svg viewBox="0 0 ${w} ${s}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${r.mhz} MHz: ${n} stalls at position 8, ${r.misreads8} misread">${rects}</svg></div>`;
  }).join("");
  const hi = rows.filter((r) => r.failed > 0), lo = rows.filter((r) => !r.failed);
  const stalls = (list) => list.reduce((n, r) => n + (r.stalls8 || 0) + (r.misreads8 || 0), 0);
  const first = hi.length ? Math.min(...hi.map((r) => r.mhz)) : null;
  $("mis-text").textContent = mis ? `Wire replies carried OK and the expected DPIDR in ${misOk} of ${mis} misreads. Each followed a stall on the first acknowledgement bit. At depth 2, these stalls coincided with the next command arriving; the following bit was sampled early. At ${first} MHz and above, ${hi.reduce((n, r) => n + r.misreads8, 0)} of ${stalls(hi)} stalls were followed by a misread acknowledgement. Below that, ${stalls(lo)} stalls caused no misreads.` : "No misread acknowledgements in this set.";
}

function renderNotes() {
  const ours = V.series.filter((s) => s.role === "ours" && !s.condition);
  const peak = peakWrite(ours);
  const notes = [];
  const gcc = ours.find((s) => s.style === "gcc"), clang = ours.find((s) => s.style === "clang");
  if (peak && gcc && clang) {
    const same = gcc.build === clang.build ? "Same firmware commit." : `Builds ${gcc.build} and ${clang.build}.`;
    notes.push(["mark-clang", "Compiler builds", `At ${peak.khz / 1000} MHz, GCC writes ${fmt(PR(gcc, "write32", 4096, peak.khz)?.kib, 1)} KiB/s and Clang ${fmt(PR(clang, "write32", 4096, peak.khz)?.kib, 1)} KiB/s. ${same}`]);
  }
  const top = (list, arm) => {
    const k = list.flatMap((s) => (s.probe_rs || []).filter((p) => complete(p) && p.arm === arm && p.bytes === 4096).map((p) => p.khz));
    return k.length ? `${Math.max(...k) / 1000} MHz` : "–";
  };
  const stock = stockSeries();
  const g50 = V.protocol === "swd" ? D.wire.gcc?.rows.find((r) => r.mhz === 50) : null;
  notes.push(["", "Highest completed clock requests", `4 KiB writes: Verge ${top(ours, "write32")}${stock ? `, stock ${top([stock], "write32")}` : ""}. Verge reads: ${top(ours, "read32")}.${g50 ? ` At a requested 50 MHz, measured wire rates are ${fmt(g50.read, 1)} MHz read / ${fmt(g50.write, 1)} MHz write.` : ""}`]);
  const conds = V.series.filter((s) => s.condition);
  if (conds.length) notes.push(["", "Under energy capture", `${conds.map((s) => s.name).join("; ")}: tick them in the key to compare with the runs without capture.`]);
  $("notes").innerHTML = notes.map(([, h, p]) => `<div><dt>${h}</dt><dd>${p}</dd></div>`).join("");
}

/* The set's wire template holds a part for each view with recordings; tickwave loads with the first
   one shown, from its own site at the version the build pins. */
let tickwaveLoad = null, wireShown = null;
function renderOnTheWire() {
  // Only a new set or view replaces the part: a ticked series must not close an open recording.
  if (wireShown === `${SET}|${VIEW}`) return;
  wireShown = `${SET}|${VIEW}`;
  const box = $("on-the-wire");
  const part = document.getElementById(`wire-${SET}`)?.content.querySelector(`.wire-view[data-view="${VIEW}"]`);
  box.replaceChildren(...(part ? [part.cloneNode(true)] : []));
  box.hidden = !part;
  if (part && !tickwaveLoad) tickwaveLoad = import(`${box.dataset.tickwave}tickwave.js`).catch((e) => console.warn("tickwave did not load:", e));
}

function renderAll() {
  D = ALL.sets[SET];
  V = D.views.find((v) => v.id === WANT) || D.views[0];
  VIEW = V.id;
  renderViews();
  renderKey();
  renderTop();
  renderJLink();
  renderProbeRs();
  drawExplorer();
  renderCliffAndFault();
  renderWire();
  renderOnTheWire();
  renderNotes();
  numberFigures();
}
// Each figure the view shows takes the next number.
function numberFigures() {
  let n = 0;
  for (const b of document.querySelectorAll("figcaption > b.n")) if (b.getClientRects().length) b.textContent = `Figure ${++n}.`;
}
// The charts draw at their containers' widths, so a new width draws them again.
let drawnAt = innerWidth, redraw = 0;
addEventListener("resize", () => {
  if (innerWidth === drawnAt) return;
  drawnAt = innerWidth;
  clearTimeout(redraw);
  redraw = setTimeout(() => { renderJLink(); renderProbeRs(); drawExplorer(); renderCliffAndFault(); renderWire(); }, 120);
});

/* With more than one dated set, the set picker shows in the header's row, beside the wire. */
if (ALL.order.length > 1) {
  $("sets").hidden = false;
  $("set-select").innerHTML = ALL.order.map((d) => `<option value="${d}" ${d === SET ? "selected" : ""}>${d}</option>`).join("");
  $("set-select").addEventListener("change", (e) => {
    SET = e.target.value;
    renderAll();
  });
}
renderAll();
</script>
</body>
